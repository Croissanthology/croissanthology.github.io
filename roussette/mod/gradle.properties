org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# --- Minecraft / NeoForge -----------------------------------------------------
# These four are the ones most likely to need touching. If the build fails while
# resolving NeoForge, look up the current 26.2 build number here:
#   https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.35-beta
neo_version_range=[26.2,)
loader_version_range=[4,)

# Parchment mappings are optional; if they are not published for 26.2 the build
# will fail on them and you can delete the parchment block in build.gradle.
parchment_minecraft=26.2
parchment_version=2026.07.19

# --- Mod ----------------------------------------------------------------------
mod_id=roussette
mod_name=Roussette
mod_license=All rights reserved
mod_version=1.0.0
mod_group_id=roussette
mod_authors=Margot
mod_description=A small lavender catshark with cat ears who hunts one specific player, relentlessly and forever.
