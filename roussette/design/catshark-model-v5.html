let build = "v5", pupil = "round";

const stage = document.getElementById('stage');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

const loader = new THREE.TextureLoader();
function tex(url){
  const t = loader.load(url);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const T = { w4:tex(TEXES.w4), f4:tex(TEXES.f4), w5:tex(TEXES.w5), f5:tex(TEXES.f5) };
function texW(){ return build==="v4" ? T.w4 : T.w5; }
function texF(){ return build==="v4" ? T.f4 : T.f5; }

const shark = new THREE.Group();
let hideMeshes = [], swellers = [], faceMeshes = [];

function construct(){
  [...hideMeshes, ...faceMeshes].forEach(m=>{ shark.remove(m); m.geometry.dispose(); m.material.dispose(); });
  hideMeshes = []; swellers = []; faceMeshes = [];
  const B = BUILDS[build];
  B.parts.forEach(d=>{
    const m = new THREE.MeshLambertMaterial({map:texW(), color:d.c});
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(d.s[0], d.s[1], d.s[2]), m);
    mesh.position.set(...d.p); mesh.rotation.set(...d.r); mesh.userData = d;
    shark.add(mesh); hideMeshes.push(mesh);
    if(d.swell) swellers.push(mesh);
  });
  B[pupil].forEach(d=>{
    const m = new THREE.MeshBasicMaterial({color:d.c});
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(d.s[0], d.s[1], d.s[2]), m);
    mesh.position.set(...d.p); mesh.rotation.set(...(d.r||[0,0,0])); mesh.userData = d;
    shark.add(mesh); faceMeshes.push(mesh);
  });
  note.textContent = B.note;
  tagline.innerHTML = 'Model ' + B.label.replace("\u00b7","&middot;") + ' &nbsp;/&nbsp; <b>not yet in game</b>';
  setMode(mode);
}
scene.add(shark);

const bubbles = [];
const bubbleGeo = new THREE.BoxGeometry(0.55,0.55,0.55);
const bubbleMat = new THREE.MeshBasicMaterial({color:0xCFE6FF, transparent:true, opacity:0.72});
for(let i=0;i<14;i++){
  const b = new THREE.Mesh(bubbleGeo, bubbleMat);
  b.visible = false; b.userData.t = Math.random();
  scene.add(b); bubbles.push(b);
}

const cage = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(16,16,16)),
  new THREE.LineBasicMaterial({color:0x5B4383}));
scene.add(cage);

const hemi = new THREE.HemisphereLight(0xFFF6FF, 0x3A2A63, 0.78);
const key  = new THREE.DirectionalLight(0xFFF0FF, 0.92); key.position.set(24,26,32);
const rim  = new THREE.DirectionalLight(0xC9A6FF, 0.40); rim.position.set(-30,10,-24);
const amb  = new THREE.AmbientLight(0x2E1D52, 0.55);
const blue = new THREE.PointLight(0x5B7BFF, 2.6, 170); blue.position.set(26,14,34);
scene.add(hemi, key, rim, amb, blue);

let mode = 'white';
function setMode(next){
  if(!hideMeshes) return;
  mode = next;
  const f = mode === 'fluor';
  hideMeshes.forEach(m=>{
    m.material.map = f ? texF() : texW();
    m.material.color.setHex(f ? 0xffffff : m.userData.c);
    m.material.emissive.setHex(f ? 0x6B4FA8 : 0x000000);
    m.material.emissiveMap = f ? texF() : null;
    m.material.emissiveIntensity = f ? 1.2 : 0;
    m.material.needsUpdate = true;
  });
  hemi.intensity = f?0.10:0.78; key.intensity = f?0.10:0.92;
  rim.intensity  = f?0.06:0.40; amb.intensity = f?0.20:0.55;
  blue.intensity = f?2.6:0.0;
  cage.material.color.setHex(f?0x2A1B4A:0x5B4383);
  document.body.style.background = f?'#07040F':'#120A22';
  btnLight.textContent = f?'Dive light':'White light';
  btnLight.setAttribute('aria-pressed', f);
}

// hand-rolled orbit — OrbitControls isn't in this three build
let theta=0.78, phi=1.22, dist=58, dragging=false, px=0, py=0, idle=true;
function place(){
  camera.position.set(dist*Math.sin(phi)*Math.cos(theta), dist*Math.cos(phi),
                      dist*Math.sin(phi)*Math.sin(theta));
  camera.lookAt(0,0,0);
}
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e=>{dragging=true; idle=false; px=e.clientX; py=e.clientY; cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',   ()=>{dragging=false;});
cv.addEventListener('pointermove', e=>{
  if(!dragging) return;
  theta -= (e.clientX-px)*0.008;
  phi = Math.max(0.22, Math.min(2.92, phi-(e.clientY-py)*0.008));
  px=e.clientX; py=e.clientY;
});
cv.addEventListener('wheel', e=>{e.preventDefault(); dist=Math.max(26,Math.min(150,dist+e.deltaY*0.06));},{passive:false});

let flopping=false, inflating=false, hunting=false, swell=1, t=0;
let flung=0, angry=0, spin=0, ko=0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function frame(){
  requestAnimationFrame(frame);
  t += 0.016;
  if(idle && !reduce) theta += 0.0022;

  if(ko>0){
    ko -= 1;
    // belly up, drifting, thoroughly out of it
    shark.rotation.x += (Math.PI - shark.rotation.x)*0.14;
    shark.rotation.z = Math.sin(t*1.1)*0.10;
    shark.rotation.y = Math.sin(t*0.7)*0.06;
    shark.position.y += ((Math.sin(t*1.4)*0.8 - 1.5) - shark.position.y)*0.06;
    shark.position.x += (0 - shark.position.x)*0.06;
    bubbles.forEach((b,i)=>{
      b.visible = true;
      const u = ((t*0.32 + b.userData.t + i*0.07) % 1);
      b.position.set(6 - i*0.9, -4 + u*18, Math.sin(i*2.1)*3.2);
      b.scale.setScalar(0.6 + u*0.9);
      b.material.opacity = 0.72*(1-u);
    });
    btnRepel.textContent = "Out cold \u00b7 " + (ko/60).toFixed(1) + "s";
    if(ko===0){ bubbles.forEach(b=>b.visible=false); btnRepel.textContent="Repellent";
      pupil = prevPupil; construct(); hunting = true; btnHunt.setAttribute('aria-pressed', true); }
  } else if(flung>0){
    flung -= 1;
    spin += 0.42;
    shark.rotation.z = spin;
    shark.rotation.x = spin*0.55;
    const k = flung/70;
    shark.position.x = -26*(1-k)*(1-k*0.2);
    shark.position.y = 34*k*(1-k) - 2;
    if(flung===0){ spin=0; shark.rotation.z=0; shark.rotation.x=0; }
  } else if(flopping){
    shark.rotation.x = Math.PI*0.42 + Math.sin(t*11)*0.55;
    shark.rotation.z = Math.sin(t*11+0.6)*0.16;
    shark.position.y = Math.abs(Math.sin(t*11))*2.6 - 4;
    shark.rotation.y = 0;
  } else if(hunting){
    // locked on: nose down, tail thrashing hard, closing distance
    shark.rotation.x += (0 - shark.rotation.x)*0.15;
    shark.rotation.z += (-0.14 - shark.rotation.z)*0.12;
    shark.rotation.y = Math.sin(t*9)*0.20;
    shark.position.y += ((Math.sin(t*9)*0.5) - shark.position.y)*0.2;
    shark.position.x = Math.sin(t*2.2)*2.2;
  } else {
    shark.rotation.x += (0-shark.rotation.x)*0.12;
    shark.rotation.z += (Math.sin(t*1.6)*0.03 - shark.rotation.z)*0.08;
    shark.position.y += ((reduce?0:Math.sin(t*1.3)*0.7) - shark.position.y)*0.08;
    shark.position.x += (0 - shark.position.x)*0.1;
    shark.rotation.z += (0 - shark.rotation.z)*0.12;
    shark.rotation.y = reduce?0:Math.sin(t*1.1)*0.05;
  }

  const target = inflating ? 1.85 : 1;
  swell += (target-swell)*0.09;
  swellers.forEach(m=>m.scale.set(1, swell, swell));

  if(angry>0 && ko===0){ angry -= 1; if(angry===0 && pupil==='slit'){ pupil='round'; construct();
    btnEye.textContent='Round eyes'; btnEye.setAttribute('aria-pressed', true); } }
  place();
  renderer.render(scene, camera);
}
function resize(){
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize); resize();

const btnLight=document.getElementById('btnLight'), btnFlop=document.getElementById('btnFlop'),
      btnBall=document.getElementById('btnBall'),  btnHunt=document.getElementById('btnHunt'),
      btnCage=document.getElementById('btnCage'),  btnReset=document.getElementById('btnReset');
btnLight.onclick=()=>setMode(mode==='white'?'fluor':'white');
btnFlop.onclick =()=>{flopping=!flopping; if(flopping)hunting=false;
  btnFlop.setAttribute('aria-pressed',flopping); btnHunt.setAttribute('aria-pressed',hunting);};
btnHunt.onclick =()=>{hunting=!hunting; if(hunting)flopping=false;
  btnHunt.setAttribute('aria-pressed',hunting); btnFlop.setAttribute('aria-pressed',flopping);};
btnBall.onclick =()=>{inflating=!inflating; btnBall.setAttribute('aria-pressed',inflating);};
btnCage.onclick =()=>{cage.visible=!cage.visible; btnCage.setAttribute('aria-pressed',cage.visible);};
btnReset.onclick=()=>{theta=0.78; phi=1.22; dist=58; idle=true;};
const btnRepel = document.getElementById('btnRepel');
let prevPupil = 'round';
btnRepel.onclick = ()=>{
  if(ko>0) return;
  prevPupil = pupil === 'ko' ? 'round' : pupil;
  ko = 600; flung = 0; hunting = false; flopping = false; inflating = false;
  btnHunt.setAttribute('aria-pressed', false); btnFlop.setAttribute('aria-pressed', false);
  btnBall.setAttribute('aria-pressed', false);
  pupil = 'ko'; construct();
};
const btnHit = document.getElementById('btnHit');
btnHit.onclick = ()=>{
  flung = 70; angry = 260; spin = 0; hunting = false; flopping = false;
  btnHunt.setAttribute('aria-pressed', false); btnFlop.setAttribute('aria-pressed', false);
  if(pupil !== 'slit'){ pupil='slit'; construct();
    btnEye.textContent='Slit eyes'; btnEye.setAttribute('aria-pressed', false); }
};

const note = document.getElementById('note');
const tagline = document.getElementById('tagline');
const btnVer = document.getElementById('btnVer'), btnEye = document.getElementById('btnEye');
btnVer.onclick = ()=>{ build = build==="v5" ? "v4" : "v5";
  btnVer.textContent = build==="v5" ? "v5 elegant" : "v4 cute";
  btnVer.setAttribute('aria-pressed', build==="v5"); construct(); };
btnEye.onclick = ()=>{ pupil = pupil==="round" ? "slit" : "round";
  btnEye.textContent = pupil==="round" ? "Round eyes" : "Slit eyes";
  btnEye.setAttribute('aria-pressed', pupil==="round"); construct(); };

mode = 'white';
construct();
btnVer.setAttribute('aria-pressed', true);
btnEye.setAttribute('aria-pressed', true);
btnCage.setAttribute('aria-pressed', true);
frame();
</script>
