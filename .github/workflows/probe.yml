name: Probe (temporary)
on:
  push:
    branches: [previews-2]
    paths: ['scripts/previews/probe.py', '.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet requests
      - run: python3 scripts/previews/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: probe-out
